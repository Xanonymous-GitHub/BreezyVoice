    "datasets>=5.0.0",
    "deepspeed==0.15.1 ; sys_platform == 'linux'",
    "diffusers==0.39.0",
    "fastapi==0.139.2",
    "fastapi-cli==0.0.32",
    "g2pw>=0.1.1",
    "gdown==5.2.2",
    "gradio==6.15.1",
    "grpcio==1.57.0",
    "grpcio-tools==1.57.0",
    "hydra-core==1.3.2",
    "hyperpyyaml==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.6.5",
    "matplotlib==3.7.5",
    "networkx==3.1",
    "omegaconf==2.3.0",
    "onnxruntime-gpu==1.16.0 ; sys_platform == 'linux'",
    "openai-whisper==20250625",
    "opencc-python-reimplemented>=0.1.7",
    "protobuf==4.25",
    "pyarrow>=25.0.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyyaml>=6.0.3",
    "rich==13.7.1",
    "setuptools>=83.0.0",
    "soundfile==0.12.1",
    "tensorboard==2.14.0",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "ttsfrd",
    "ttsfrd-dependency",
